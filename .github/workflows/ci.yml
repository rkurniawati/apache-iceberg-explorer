name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-package:
    name: Test & Build VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build and package VSIX
        run: npm run package

      - name: Upload VSIX artifact for verification
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-explorer-ci-build
          path: "*.vsix"
          if-no-files-found: error
